    🌱 Hi, I'm Yifei Sun (孙逸飞), a PhD student in Computer Science and Technology at [Zhejiang University](https://www.zju.edu.cn). I received dual bachelor's degrees from [Hangzhou Dianzi University](https://www.hdu.edu.cn) and [ITMO University](https://itmo.ru/).
  - >-
    🔭 I'm currently focused on **Medical Image Analysis**, **Generative AI**, and **Multimodal Learning**.
