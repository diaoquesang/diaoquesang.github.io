# =============================================================
# Site settings — edit here, rarely needed elsewhere
# =============================================================
title        : "Yifei Sun (孙逸飞)"
description  : "Zhejiang University"
repository   : "diaoquesang/diaoquesang.github.io"
timezone     : Asia/Shanghai
encoding     : "utf-8"
lang         : "en"

# SEO verification (kept identical to the original site)
google_site_verification : "5SY2aUF5jGYYojBuBEx0VUKFwkiST80yqbTC2uf6xYA"
bing_site_verification   : "FB55B19AD13FC5F0DC506AB338336016"
baidu_site_verification  : ""

# Google Analytics id, leave empty to disable
google_analytics_id      : ""

# =============================================================
# Author profile — sidebar reads this
# =============================================================
author:
  name    : "Yifei Sun (孙逸飞)"
  avatar  : "images/avatar.jpg"
  bio     : "Through hardship, true worth emerges."
  location: "Hangzhou, China"

# =============================================================
# Build / output
# =============================================================
permalink: /:categories/:title/

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - scripts
  - preview
  - tools
  # support files for the repo itself, never part of the published site
  # (same entries the original site excluded):
  - google_scholar_crawler
  - .github

markdown : kramdown
highlighter: rouge
lsi      : false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default

sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
