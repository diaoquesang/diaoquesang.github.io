<!doctype html>
{% assign base = page.base %}
<html lang="{{ site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body>
  {% include sidebar.html %}

  <button id="drawer-toggle" class="drawer-toggle" aria-label="Open navigation">
    <i class="fa-solid fa-bars"></i>
  </button>

  <main class="main" id="main" role="main">
    <article class="page">
      {{ content }}
    </article>
  </main>

  {% include music-player.html %}

  <script src="{{ base }}assets/js/theme.js"></script>
  <script src="{{ base }}assets/js/nav.js"></script>
  <script src="{{ base }}assets/js/scroll-hints.js"></script>
</body>
</html>
